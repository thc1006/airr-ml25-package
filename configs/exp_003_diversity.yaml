# Experiment 003: Add diversity and clonality metrics
# Expected improvement: +0.01-0.02 AUC

experiment:
  name: exp_003_diversity
  description: "Multi-scale k-mer + V/J + diversity metrics"
  author: "Competition Master"
  date: "2025-12-08"

data:
  train_root: "./data/train_datasets"
  test_root: "./data/test_datasets"
  datasets: [1, 2, 3, 4, 5, 6, 7, 8]

features:
  type: "combined"

  kmer:
    k_values: [3, 4, 5]
    use_tfidf: true
    max_features: null
    min_df: 2
    sublinear_tf: true

  vj_gene:
    v_gene:
      type: "frequency"
      top_n: 100
      normalize: true
    j_gene:
      type: "frequency"
      top_n: 20
      normalize: true
    vj_pair:
      type: "frequency"
      top_n: 500
      normalize: true
    gene_family:
      aggregate_by_family: true

  # Diversity and clonality metrics (NEW)
  diversity:
    shannon_entropy: true  # 序列多樣性
    simpson_index: true
    gini_coefficient: true  # 克隆擴增度
    d50: true  # Diversity 50
    chao1: true  # 估計總序列種類數

    # CDR3 length distribution
    cdr3_length:
      mean: true
      std: true
      median: true
      skewness: true
      kurtosis: true
      min: true
      max: true

    # Clonality metrics
    clonality:
      top_clone_freq: [1, 5, 10, 50]  # Top 1, 5, 10, 50 clone 的頻率
      unique_ratio: true
      productive_ratio: true  # 如果有 productive 欄位

  basic:
    - seq_count
    - total_count

model:
  type: "xgboost"
  xgboost:
    n_estimators: 400  # 增加樹的數量
    max_depth: 7
    learning_rate: 0.04  # 降低學習率
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "gpu_hist"
    gpu_id: 0
    predictor: "gpu_predictor"
    eval_metric: "auc"
    reg_alpha: 0.1
    reg_lambda: 1.0

  per_dataset: true

training:
  cv:
    method: "stratified_kfold"
    n_splits: 5
    random_state: 42
  early_stopping_rounds: 50
  verbose_eval: 50

task_b:
  method: "combined"
  top_k: 50000
  aggregation: "weighted_sum"
  weights:
    kmer: 0.6
    vj_gene: 0.3
    diversity: 0.1

output:
  model_path: "models/xgboost_k345_vj_div.pkl"
  submission_path: "outputs/submission.csv"
  save_predictions: true
  save_feature_importance: true
