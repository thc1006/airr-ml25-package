[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and behavior
addopts =
    -v
    --tb=short
    --strict-markers
    -W error::UserWarning
    --color=yes
    --durations=10
    --maxfail=1

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests requiring GPU (deselect with '-m "not gpu"')
    integration: marks integration tests
    unit: marks unit tests
    performance: marks performance benchmarks
    requires_data: marks tests requiring full dataset

# Console output
console_output_style = progress

# Timeout
timeout = 300

# Coverage (if pytest-cov installed)
# Run with: pytest --cov=champion_v13 --cov-report=html
